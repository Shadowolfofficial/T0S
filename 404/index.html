
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0c10">
<title>404 — Lien expiré | ThunderOS</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --bg: #0b0c10;
  --yellow: #ffcd38;
  --text: #f5f5f7;
  --muted: #a0a2ae;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, sans-serif;
  overflow: hidden;
}

body::before {
  content: "";
  position: fixed;
  width: 500px;
  height: 500px;
  top: -330px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--yellow);
  filter: blur(160px);
  opacity: .13;
  pointer-events: none;
}

.container {
  width: min(90%, 480px);
  text-align: center;
  position: relative;
  animation: appear .7s ease both;
}

.brand {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-bottom: 28px;
  font-size: 17px;
  font-weight: 800;
}

.brand img {
  width: 42px;
  height: 42px;
  border-radius: 11px;
  object-fit: cover;
}

.brand span { color: var(--yellow); }

.error-code {
  font-size: clamp(95px, 22vw, 155px);
  font-weight: 800;
  letter-spacing: -9px;
  line-height: 1;
  color: var(--yellow);
  text-shadow: 0 0 80px #ffcd3825;
}

h1 {
  margin: 20px 0 12px;
  font-size: clamp(25px, 5vw, 34px);
  letter-spacing: -1px;
}

.description {
  margin: 0 auto 30px;
  max-width: 360px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.8;
}

.restart {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  max-width: 310px;
  min-height: 58px;
  border: 0;
  border-radius: 14px;
  background: linear-gradient(120deg, #ffdd69, #ffbf24);
  color: #191919;
  font-family: inherit;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 8px 30px #ffcd3820;
  transition: transform .2s, box-shadow .2s;
  user-select: none;
}

.restart:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 35px #ffcd3840;
}

.restart:active { transform: scale(.98); }

.restart:focus-visible {
  outline: 2px solid white;
  outline-offset: 4px;
}

.restart svg {
  width: 20px;
  height: 20px;
}

.hint {
  margin-top: 17px;
  color: #888a96;
  font-size: 12px;
}

.footer {
  position: fixed;
  bottom: 25px;
  font-size: 11px;
  color: #666875;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (prefers-reduced-motion: reduce) {
  .container { animation: none; }
  .restart { transition: none; }
}
</style>
</head>

<body>

<main class="container">
  <div class="brand">
    <img src="/logo.png" alt="Logo ThunderOS">
    <div>Thunder<span>Os</span></div>
  </div>

  <div class="error-code" aria-hidden="true">404</div>

  <h1>Lien expiré</h1>

  <p class="description">
    Votre lien d'accès à ThunderOs a expiré
    ou n'est plus valide.
    Relancez ThunderOs pour obtenir
    un nouveau lien et continuer.
  </p>

  <button class="restart" id="restartBtn" type="button">
    <svg xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 3-6.7"/>
      <path d="M3 3v6h6"/>
    </svg>
    Relancer ThunderOs
  </button>

  <div class="hint" id="hint" aria-live="polite">
    Double-cliquez sur le bouton pour continuer
  </div>
</main>

<footer class="footer">
  © ThunderOs · Tous droits réservés
</footer>

<script>
const restartBtn = document.getElementById("restartBtn");
const hint = document.getElementById("hint");

function restartThunderOS() {
  hint.textContent = "Redirection vers ThunderOs...";
  window.location.replace("https://xos.pages.dev/");
}

// Double-clic obligatoire à la souris
restartBtn.addEventListener("dblclick", restartThunderOS);

// Double activation au clavier (Entrée ou Espace)
let lastActivation = 0;

restartBtn.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;

  e.preventDefault();

  const now = Date.now();

  if (now - lastActivation < 600) {
    lastActivation = 0;
    restartThunderOS();
  } else {
    lastActivation = now;
    hint.textContent = "Encore une fois pour relancer ThunderOS";
  }
});

// Indication après un simple clic
restartBtn.addEventListener("click", () => {
  hint.textContent = "Double-cliquez pour relancer ThunderOS";
});
</script>

</body>
</html>
