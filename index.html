
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0c10">
<meta name="04eeb17b910f036d04ea8b63cd15bfdf528e4fe1"
      content="04eeb17b910f036d04ea8b63cd15bfdf528e4fe1">
<meta name="referrer" content="no-referrer-when-downgrade">
<meta name="description" content="ThunderOS, votre espace numérique.">
<link rel="manifest" href="manifest.json">
<title>ThunderOs</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --bg: #0b0c10;
  --surface: #15161b;
  --border: #303139;
  --yellow: #ffcd38;
  --text: #f7f7fa;
  --muted: #92949e;
}

* { box-sizing: border-box; }

html { min-height: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Inter, system-ui, sans-serif;
  color: var(--text);
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  width: 650px;
  height: 650px;
  top: -480px;
  left: 50%;
  transform: translateX(-50%);
  border-radius: 50%;
  background: #ffcd38;
  box-shadow: 0 0 170px 90px #ffcd3818;
  opacity: .5;
  pointer-events: none;
}

.page {
  width: 100%;
  max-width: 660px;
  padding: 55px 20px 30px;
  text-align: center;
  position: relative;
  animation: enter .65s ease both;
}

.logo {
  width: 112px;
  height: 112px;
  border-radius: 27px;
  object-fit: cover;
  box-shadow: 0 12px 50px #ffcd3824;
  margin-bottom: 22px;
}

h1 {
  margin: 0;
  font-size: clamp(35px, 7vw, 51px);
  font-weight: 800;
  letter-spacing: -2px;
}

h1 span { color: var(--yellow); }

.tagline {
  margin: 12px 0 35px;
  color: var(--muted);
  font-size: 13px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.card {
  background: linear-gradient(155deg, #1c1d23, #121318);
  border: 1px solid var(--border);
  border-radius: 25px;
  padding: 30px;
  box-shadow: 0 20px 65px #0005;
}

.notice {
  background: #ffcd3809;
  border: 1px solid #ffcd3835;
  border-radius: 13px;
  padding: 15px;
  font-size: 13px;
  line-height: 1.6;
  color: #c9c9cf;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.notice-icon {
  color: var(--yellow);
  font-size: 20px;
  font-weight: 700;
}

.terms {
  display: inline-block;
  margin: 20px 0 25px;
  color: var(--yellow);
  font-size: 13px;
  text-decoration: none;
  transition: opacity .2s;
}

.terms:hover { opacity: .7; }

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

button {
  font: inherit;
  cursor: pointer;
  border-radius: 13px;
  min-height: 54px;
  border: 1px solid #3a3b44;
  background: #202127;
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  transition: background .2s, transform .2s,
              border-color .2s, box-shadow .2s;
}

button:hover {
  background: #292a31;
  border-color: #656671;
  transform: translateY(-2px);
}

button:focus-visible, a:focus-visible {
  outline: 2px solid var(--yellow);
  outline-offset: 4px;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

button:disabled:hover { transform: none; }

.btn-main {
  grid-column: 1 / -1;
  min-height: 65px;
  background: linear-gradient(120deg, #ffdc62, #ffbf23);
  border: 0;
  color: #171717;
  font-size: 16px;
  font-weight: 800;
  box-shadow: 0 6px 24px #ffcd3822;
}

.btn-main:hover {
  background: linear-gradient(120deg, #ffe68a, #ffd04c);
  box-shadow: 0 10px 32px #ffcd3840;
}

.btn-icon {
  margin-right: 9px;
  font-size: 18px;
  vertical-align: middle;
}

.hint {
  margin-top: 22px;
  padding: 13px;
  background: #ffffff06;
  border: 1px solid #ffffff14;
  border-radius: 12px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

#installHint {
  margin-top: 15px;
  font-size: 12px;
  color: var(--yellow);
  line-height: 1.7;
}

#installHint:empty { display: none; }

.social-title {
  margin-top: 34px;
  color: #797b85;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 3px;
}

.socials {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 18px;
}

.socials a {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: #18191e;
  transition: transform .2s, border-color .2s,
              background .2s;
}

.socials a:hover {
  transform: translateY(-4px);
  border-color: var(--yellow);
  background: #25231b;
}

.socials img {
  width: 26px;
  height: 26px;
  object-fit: contain;
}

footer {
  margin-top: 30px;
  color: #646671;
  font-size: 11px;
}

@keyframes enter {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 500px) {
  .page { padding: 35px 15px 25px; }
  .card { padding: 20px 16px; }
  .logo { width: 90px; height: 90px; }
  .tagline { font-size: 11px; letter-spacing: 1px; }
  .buttons { grid-template-columns: 1fr; }
  .btn-main { grid-column: auto; }
  button { width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<main class="page">
  <img class="logo" src="logo.png" alt="Logo ThunderOS">

  <h1>Thunder<span>Os</span></h1>
  <p class="tagline">Votre espace, sans limites</p>

  <section class="card" aria-label="Accès ThunderOS">
    <div class="notice">
      <span class="notice-icon">ⓘ</span>
      <span>
        En cas de bug, réinitialisez ThunderOs
        dans les paramètres.
      </span>
    </div>

    <a class="terms" href="cdu.html">
      Conditions d'utilisation ↗
    </a>

    <div class="buttons">
      <button class="btn-main" id="1.securityboot">
        <span class="btn-icon">⚡</span>
        Accéder à ThunderOs
      </button>

      <button id="3.securityboot">
        <span class="btn-icon">☏</span>
        Propositions & Bugs
      </button>

      <button id="installer">
        <span class="btn-icon">↓</span>
        Installer ThunderOs
      </button>
    </div>

    <div class="hint">
      Double-cliquez sur un bouton pour ouvrir
      le lien correspondant.
    </div>

    <div id="installHint" role="status"
         aria-live="polite"></div>
  </section>

  <div class="social-title">SUIVEZ THUNDEROS</div>

  <nav class="socials" aria-label="Réseaux sociaux">
    <a href="https://www.tiktok.com/@thunder0s"
       target="_blank" rel="noopener noreferrer"
       aria-label="TikTok">
      <img src="tiktok.png" alt="">
    </a>

    <a href="https://discord.com/invite/bN5qfCE2dV"
       target="_blank" rel="noopener noreferrer"
       aria-label="Discord">
      <img src="discord.png" alt="">
    </a>

    <a href="https://www.instagram.com/thunder0s.dev/"
       target="_blank" rel="noopener noreferrer"
       aria-label="Instagram">
      <img src="instagram.png" alt="">
    </a>
  </nav>

  <footer>© ThunderOs · Tous droits réservés</footer>
</main>

<script>
"use strict";

// Vérification du token reçu
const params = new URLSearchParams(location.search);

if (params.has("tok") && params.has("exp")) {
  const exp = Number(params.get("exp"));

  if (!Number.isFinite(exp) || Date.now() > exp) {
    location.replace("https://t0s.pages.dev/404/");
  }
}

// Redirection en mode application installée
const standalone = window.matchMedia(
  "(display-mode: standalone)"
).matches || navigator.standalone === true;

if (standalone) {
  location.replace("https://t0s.pages.dev/addappnow");
}

// Génération des paramètres de navigation
function createTokenUrl(url) {
  const exp = Date.now() + 60000;
  const random = new Uint32Array(1);
  crypto.getRandomValues(random);

  const token = btoa(`${exp}-${random[0]}`);
  const target = new URL(url);

  target.searchParams.set("tok", token);
  target.searchParams.set("exp", exp);

  return target.href;
}

// Ouverture dans about:blank avec iframe
function openThunder(url) {
  const targetUrl = createTokenUrl(url);

  const tab = window.open("about:blank", "_blank");

  if (!tab) {
    // Alternative si les pop-ups sont bloquées
    location.href = targetUrl;
    return;
  }

  try {
    tab.document.open();
    tab.document.write(`<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">
<title>ThunderOS</title>
<style>
html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#0b0c10;
}
iframe {
  display:block;
  width:100%;
  height:100%;
  border:0;
}
</style>
</head>
<body>
<iframe id="thunderFrame"
        title="ThunderOS"
        allowfullscreen></iframe>
</body>
</html>`);
    tab.document.close();

    tab.document.getElementById("thunderFrame").src =
      targetUrl;
  } catch (error) {
    tab.location.href = targetUrl;
  }
}

function setupLaunch(id, url) {
  const button = document.getElementById(id);
  if (!button) return;

  button.addEventListener("dblclick", () => {
    openThunder(url);
  });

  // Accessibilité clavier
  button.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      openThunder(url);
    }
  });
}

setupLaunch(
  "1.securityboot",
  "https://apptos.pages.dev/"
);

setupLaunch(
  "3.securityboot",
  "./peb.html"
);

// Installation PWA
let deferredPrompt = null;

const installBtn = document.getElementById("installer");
const installHint = document.getElementById("installHint");

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
});

window.addEventListener("appinstalled", () => {
  deferredPrompt = null;
  installBtn.disabled = true;
  installBtn.textContent = "✓ ThunderOS installé";
  installHint.textContent = "Installation terminée !";
});

installBtn.addEventListener("dblclick", async () => {
  if (deferredPrompt) {
    const promptEvent = deferredPrompt;
    deferredPrompt = null;

    try {
      await promptEvent.prompt();
      const result = await promptEvent.userChoice;

      installHint.textContent =
        result.outcome === "accepted"
          ? "Installation acceptée."
          : "Installation annulée.";
    } catch {
      installHint.textContent =
        "L'installation automatique est indisponible.";
    }
    return;
  }

  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);

  installHint.textContent = ios
    ? "Sur iPhone : ouvrez Partager, puis « Sur l'écran d'accueil »."
    : "Ouvrez le menu du navigateur et choisissez « Installer l'application » ou « Ajouter à l'écran d'accueil ».";
});
</script>

</body>
</html>
